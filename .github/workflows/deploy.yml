name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: deploy
        uses: actions/deploy-pages@v5
