on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: setup gh pages
        id: pages
        uses: actions/configure-pages@v6

      - name: setup hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.169.0
          extended: true

      - name: build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: upload artifact
        uses: actions/upload-pages-artifact@v7
        with:
          path: ./public

      - name: deploy
        uses: actions/deploy-pages@v5
