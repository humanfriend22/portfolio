{{- $p := .page -}}
<a class="card{{ if .featured }} card-featured{{ end }}" href="{{ $p.RelPermalink }}">
{{- with $p.Params.cover }}<img class="card-cover" src="{{ . | relURL }}" alt="" loading="lazy">{{ end }}
<span class="card-title">{{ $p.Title }}</span>
<span class="card-summary">{{ $p.Params.summary }}</span>
{{- if .featured }}
<span class="card-meta">{{ range $p.Params.stack }}<code class="chip">{{ . }}</code>{{ end }}</span>
{{- else }}
<span class="card-stack">{{ delimit $p.Params.stack " · " }}</span>
{{- end }}
</a>
