{{- /* {{% media src="/images/x.png" alt="..." side="left|right" caption="..." %}}markdown text{{% /media %}} — src is optional; without it the text just fills the row */ -}}
<div class="media" data-side="{{ .Get "side" | default "left" }}">
{{- with .Get "src" }}
<figure class="media-figure">
<img src="{{ . | relURL }}" alt="{{ $.Get "alt" }}" loading="lazy">
{{- with $.Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
{{- end }}
<div class="media-text">

{{ .Inner }}

</div>
</div>
